<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Forgot Password - Account Recovery</title>
<!-- Tailwind CSS v3 with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            },
            surface: {
              bg: '#111317',
              card: '#1a1c20',
              border: '#2d3139',
              input: '#121418',
              inputBorder: '#363b46',
            }
          }
        }
      }
    }
  </script>
<!-- Custom Styling for specific transitions and dark backdrop -->
<style data-purpose="base-styling">
    body {
      background-color: #111317;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .custom-ring:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-blue-600 selection:text-white">
<!-- BEGIN: MinimalBrandHeader -->
<header class="w-full pt-8 pb-4 px-6 flex justify-center items-center" data-purpose="brand-header">
<a class="flex items-center gap-2 text-white font-semibold text-lg tracking-tight hover:opacity-90 transition-opacity" href="#">
<div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
<!-- Brand geometric emblem -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<span class="text-white text-base tracking-wide font-medium">SOVEREIGN</span>
</a>
</header>
<!-- END: MinimalBrandHeader -->
<!-- BEGIN: RecoveryCardMainSection -->
<main class="flex-grow flex items-center justify-center px-4 py-8" data-purpose="main-recovery-content">
<div class="w-full max-w-md bg-[#1a1c20] border border-[#2d3139] rounded-2xl p-8 shadow-2xl relative" data-purpose="recovery-card">
<!-- Icon Badge Header -->
<div class="flex flex-col items-center text-center mb-6">
<div class="w-14 h-14 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center mb-4 text-blue-500 shadow-inner">
<!-- Keyhole / Secure Email Icon -->
<svg class="w-7 h-7 text-[#3b82f6]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<h1 class="text-2xl font-bold text-white tracking-tight">Reset Your Password</h1>
<p class="text-sm text-gray-400 mt-2 leading-relaxed">
          Enter your verified email address and we will send you secure password reset instructions.
        </p>
</div>
<!-- Success Notification Banner Preview State -->
<aside aria-label="Status notice" class="mb-6 rounded-xl bg-blue-950/40 border border-blue-800/40 p-3.5 flex items-start gap-3" data-purpose="success-callout">
<svg class="w-5 h-5 text-blue-400 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<p class="text-xs text-blue-200 leading-normal">
<strong class="font-semibold text-white">Check your email:</strong> We have sent a reset link to your inbox with a 15-minute expiration.
        </p>
</aside>
<!-- Password Reset Request Form -->
<form action="#" class="space-y-5" data-purpose="recovery-form" method="POST" onsubmit="event.preventDefault();">
<div>
<label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2" for="email-address">
            Email Address
          </label>
<div class="relative">
<input class="w-full px-4 py-3 rounded-xl bg-[#121418] border border-[#363b46] text-white placeholder-gray-500 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors" id="email-address" name="email" placeholder="e.g. alexander@sovereign.io" required="" type="email">
</div>
</div>
<button class="w-full py-3.5 px-4 rounded-xl bg-[#3b82f6] hover:bg-blue-600 active:bg-blue-700 text-white font-medium text-sm tracking-wide transition duration-150 ease-in-out shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 cursor-pointer" type="submit">
<span>Send Reset Link</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</form>
<!-- Return Link Navigation -->
<div class="mt-6 pt-6 border-t border-[#2d3139] text-center" data-purpose="form-footer-navigation">
<a class="inline-flex items-center text-sm font-medium text-gray-400 hover:text-white transition-colors group" href="#">
<svg class="w-4 h-4 mr-2 text-gray-500 group-hover:text-white group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
          Back to Sign In
        </a>
</div>
</div>
</main>
<!-- END: RecoveryCardMainSection -->
<!-- BEGIN: PageFooter -->
<footer class="w-full py-6 px-4 border-t border-[#1a1c20]" data-purpose="site-footer">
<div class="max-w-md mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-gray-500">
<div class="flex items-center gap-1.5">
<svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>256-Bit SSL Encryption</span>
</div>
<nav class="flex items-center space-x-4">
<a class="hover:text-gray-400 transition-colors" href="#">Privacy Policy</a>
<span class="text-gray-700">|</span>
<a class="hover:text-gray-400 transition-colors" href="#">Contact Support</a>
</nav>
</div>
</footer>
<!-- END: PageFooter -->
</body></html>
